# COVID-19 Radiography: small dataset, template reports, CPU-friendly
# Data: put COVID-19_Radiography_Dataset (COVID/, Normal/, Viral Pneumonia/) in data/covid19/
# Train: python train.py --config config_covid19.yaml

data:
  dataset: "covid19"
  data_dir: "data"
  covid19_dir: "data/COVID-19_Radiography_Dataset"
  image_size: 224
  max_seq_len: 128
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

model:
  encoder: "resnet18"
  decoder: "distilbert/distilgpt2"
  densenet_pretrained: true
  embed_dim: 768
  num_layers: 6
  dropout: 0.1

train:
  batch_size: 16
  epochs: 5
  lr: 1e-4
  weight_decay: 0.01
  gradient_clip: 1.0
  save_every: 1
  checkpoint_dir: "checkpoints"

eval:
  metrics: ["bleu", "rouge"]
  bleu_ngrams: 4
  rouge_metrics: ["rougeL"]

api:
  host: "0.0.0.0"
  port: 8000
  max_file_size_mb: 10
  repetition_penalty: 2.2
  temperature: 1.0
  top_p: 1.0
