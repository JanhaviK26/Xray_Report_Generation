# COVID-19 CXR Report Generation - Config

data:
  dataset: "covid19"
  data_dir: "data"
  covid19_dir: "data/COVID-19_Radiography_Dataset"
  image_size: 224
  max_seq_len: 128
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

model:
  encoder: "resnet18"
  decoder: "distilbert/distilgpt2"
  densenet_pretrained: true
  embed_dim: 768
  num_layers: 6
  dropout: 0.1

train:
  batch_size: 16
  epochs: 10
  lr: 5e-5              # lower LR to reduce overfitting (was 1e-4)
  weight_decay: 0.01
  gradient_clip: 1.0
  save_every: 1
  checkpoint_dir: "checkpoints"
  early_stop_patience: 3   # allow a bit more epochs before early stop

eval:
  metrics: ["bleu", "rouge"]
  bleu_ngrams: 4
  rouge_metrics: ["rougeL"]

api:
  host: "0.0.0.0"
  port: 8000
  max_file_size_mb: 10
  max_gen_tokens: 48        # short reports, less room for drift
  num_beams: 3              # beam search (1 = greedy)
  length_penalty: 1.0       # (5+len)^alpha / 6^alpha
  repetition_penalty: 2.5   # stronger to reduce repetition
  temperature: 1.0         # greedy when num_beams==1 (no sampling)
  top_p: 1.0
  top_k: 50                 # only consider top-50 tokens, cuts gibberish
  no_repeat_ngram_size: 4   # avoid repeating 4-grams
